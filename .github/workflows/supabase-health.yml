name: Deploy read-only portal health functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-health.yml
      - supabase/functions/iyzico-health/index.ts
      - supabase/functions/portal-commerce-health/index.ts

permissions:
  contents: read

concurrency:
  group: cliniga-read-only-health-deployment
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check health deployment contract
        run: node --test scripts/health-deployment.test.mjs
      - name: Require the existing deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN; no function was deployed."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Deploy only the two read-only health functions
        run: >-
          supabase --workdir . functions deploy iyzico-health portal-commerce-health
          --remote=brxntrrfbodanpckhfgm --use-api --no-verify-jwt --yes
      - name: Check health routes and browser boundaries
        run: node scripts/check-health-functions.mjs
