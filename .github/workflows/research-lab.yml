name: Thesis Research Lab

on:
  pull_request:
    paths:
      - "research-lab/**"
      - ".github/workflows/research-lab.yml"
  push:
    branches: [main, integration/secure-intelligence-suite]
    paths:
      - "research-lab/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: research-lab
        run: python -m unittest discover -s tests -v
      - name: Compile
        working-directory: research-lab
        run: python -m compileall -q src tests
