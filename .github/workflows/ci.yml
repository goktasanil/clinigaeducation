name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting of new privacy components
        run: npx prettier --check src/components/AdSenseLoader.tsx src/components/CookieConsent.tsx src/lib/consent.ts

      - name: Lint
        run: npm run lint

      - name: Build and generate routes
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Install isolated database test dependencies
        run: npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund

      - name: Test administrator report row policies
        run: npm --prefix supabase/tests test
