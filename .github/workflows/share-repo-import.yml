name: Shared conversation repo import

on:
  push:
    branches: [cliniga-ai-engine]
    paths:
      - '.github/workflows/share-repo-import.yml'

permissions:
  contents: read

jobs:
  extract-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract GitHub repositories from public ChatGPT share
        env:
          SHARE_ID: 6a934d8b-f924-83eb-af81-4316c584d46f
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          share_id = "6a934d8b-f924-83eb-af81-4316c584d46f"
          url = f"https://chatgpt.com/backend-api/share/{share_id}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 CliniGA-Repo-Importer/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              raw = response.read().decode("utf-8", errors="replace")
          data = json.loads(raw)

          strings = []
          def walk(value):
              if isinstance(value, str):
                  strings.append(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(data)

          url_re = re.compile(r"https?://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)", re.I)
          token_re = re.compile(r"(?<![A-Za-z0-9_.-])([A-Za-z0-9_.-]{2,})/([A-Za-z0-9_.-]{2,})(?![A-Za-z0-9_.-])")
          repos = set()
          evidence = []
          for text in strings:
              for owner, repo in url_re.findall(text):
                  repos.add(f"{owner}/{repo.rstrip('.,;:)}]')}")
              if "github" in text.lower() or "repo" in text.lower() or "repository" in text.lower():
                  evidence.append(text.replace("\n", " ")[:2000])
                  for owner, repo in token_re.findall(text):
                      if owner.lower() not in {"http", "https", "www", "api", "backend-api"}:
                          repos.add(f"{owner}/{repo.rstrip('.,;:)}]')}")

          print("===REPOSITORIES===")
          for repo in sorted(repos, key=str.lower):
              print(repo)
          print("===EVIDENCE===")
          for line in evidence[:200]:
              print(line)
          print("===END===")
          PY
