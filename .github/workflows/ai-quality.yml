name: CliniGA AI quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-quality.yml'
  push:
    branches: [cliniga-ai-engine]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-quality.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install fastapi pydantic pytest httpx langgraph pyyaml
      - name: Syntax check
        run: python -m compileall ai
      - name: Static policy tests
        run: |
          python - <<'PY'
          from ai.security.tool_permissions import ToolPolicy
          p=ToolPolicy()
          assert p.decision('secrets.read') == 'deny'
          assert p.decision('github.write') == 'approval_required'
          assert p.decision('rag.search') == 'allow'
          print('tool policy ok')
          PY
      - name: Advanced safety tests
        run: python -m pytest -q ai/evals/test_advanced_safety.py
      - name: Production control tests
        run: python -m pytest -q ai/evals/test_production_controls.py
      - name: Benchmark schema check
        run: |
          python - <<'PY'
          import json
          rows=[json.loads(x) for x in open('ai/evals/benchmark.jsonl') if x.strip()]
          assert rows and all({'id','task','checks'} <= set(r) for r in rows)
          print(f'{len(rows)} benchmark cases valid')
          PY
      - name: Guardrail config validation
        run: |
          python - <<'PY'
          import yaml
          cfg=yaml.safe_load(open('ai/guardrails/config/config.yml'))
          assert 'rails' in cfg and 'prompts' in cfg
          assert 'input' in cfg['rails'] and 'output' in cfg['rails']
          print('guardrail config valid')
          PY
      - name: Promptfoo config validation
        run: |
          python - <<'PY'
          import yaml
          cfg=yaml.safe_load(open('ai/evals/promptfoo.yaml'))
          assert cfg.get('providers') and cfg.get('tests')
          assert len(cfg['tests']) >= 4
          print('promptfoo config valid')
          PY
      - name: Production manifest validation
        run: |
          python - <<'PY'
          import pathlib, yaml
          files = [
              'ai/deploy/helm/templates/security.yaml',
              'ai/deploy/helm/templates/external-secret.yaml',
              'ai/deploy/argocd/application.yaml',
              'ai/observability/prometheus-rules.yaml',
              'ai/chaos/pod-kill.yaml',
          ]
          for file in files:
              docs=list(yaml.safe_load_all(open(file)))
              assert docs and all(d is not None for d in docs), file
          assert pathlib.Path('ai/migrations/001_init.sql').read_text().strip()
          print('production manifests valid')
          PY
