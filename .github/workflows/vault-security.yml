name: Secure Vault security

on:
  pull_request:
    branches: [main]
    paths:
      - 'vault/**'
      - '.github/workflows/vault-security.yml'
  push:
    branches: [secure-intelligence-vault]
    paths:
      - 'vault/**'
      - '.github/workflows/vault-security.yml'

permissions:
  contents: read

jobs:
  vault-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall vault
      - name: Policy smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          from vault.models import AccessContext, Sensitivity, VaultResource
          from vault.policy import authorize

          r = VaultResource('r1', 'tenant-a', Sensitivity.RESTRICTED, 'owner')
          try:
              authorize(AccessContext('tenant-b','u','admin','test',approved=True), r)
              raise SystemExit('cross-tenant access should fail')
          except PermissionError:
              pass
          try:
              authorize(AccessContext('tenant-a','u','analyst','test'), r)
              raise SystemExit('restricted read without approval should fail')
          except PermissionError:
              pass
          authorize(AccessContext('tenant-a','u','admin','incident response',approved=True), r)
          print('vault policy ok')
          PY
