name: CliniGA AI security

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-security.yml'
      - '.github/workflows/ai-quality.yml'
  push:
    branches: [cliniga-ai-engine]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-security.yml'
      - '.github/workflows/ai-quality.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  defensive-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install SAST and secret scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit detect-secrets pip-audit

      - name: Semgrep SAST
        run: semgrep scan --config auto --error ai

      - name: Bandit Python security
        run: bandit -r ai -ll

      - name: detect-secrets
        run: detect-secrets scan ai .github/workflows/ai-quality.yml .github/workflows/ai-security.yml > /tmp/detect-secrets.json

      - name: Python dependency audit
        run: pip-audit -r ai/requirements.txt

      - name: Gitleaks current AI tree scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo/ai --no-git --no-banner --redact --exit-code=1

      - name: Trivy AI filesystem and dependency scan
        run: |
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:latest \
            fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /workspace/ai

      - name: Verify GitHub Actions are commit-pinned
        run: |
          python - <<'PY'
          import re, pathlib
          files=['.github/workflows/ai-quality.yml','.github/workflows/ai-security.yml']
          bad=[]
          pat=re.compile(r'uses:\s+[^@\s]+@([^\s]+)')
          for f in files:
              for i,line in enumerate(pathlib.Path(f).read_text().splitlines(),1):
                  m=pat.search(line)
                  if m and not re.fullmatch(r'[0-9a-f]{40}', m.group(1)):
                      bad.append(f'{f}:{i}:{m.group(1)}')
          assert not bad, f'Unpinned actions: {bad}'
          print('AI workflows use immutable action SHAs')
          PY
