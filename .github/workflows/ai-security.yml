name: CliniGA AI security

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-security.yml'
      - '.github/workflows/ai-quality.yml'
      - '.github/workflows/ai-profile-build.yml'
  push:
    branches: [cliniga-ai-engine]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-security.yml'
      - '.github/workflows/ai-quality.yml'
      - '.github/workflows/ai-profile-build.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  defensive-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install SAST and secret scanners
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit detect-secrets pip-audit

      - name: Semgrep SAST
        run: semgrep scan --config auto --error ai

      - name: Bandit Python security
        run: bandit -r ai -ll

      - name: detect-secrets report
        run: detect-secrets scan ai .github/workflows/ai-*.yml > /tmp/detect-secrets.json

      - name: Python core dependency audit
        run: pip-audit -r ai/requirements.txt

      - name: Gitleaks current AI tree scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo/ai --no-git --no-banner --redact --exit-code=1

      - name: Trivy AI filesystem and dependency scan
        run: |
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:latest \
            fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /workspace/ai

      - name: Verify all AI GitHub Actions are commit-pinned
        run: |
          python - <<'PY'
          import pathlib, re
          files=sorted(pathlib.Path('.github/workflows').glob('ai-*.yml'))
          bad=[]
          pat=re.compile(r'uses:\s+[^@\s]+@([^\s]+)')
          for path in files:
              for i,line in enumerate(path.read_text().splitlines(),1):
                  m=pat.search(line)
                  if m and not re.fullmatch(r'[0-9a-f]{40}', m.group(1)):
                      bad.append(f'{path}:{i}:{m.group(1)}')
          assert files, 'No AI workflows found'
          assert not bad, f'Unpinned actions: {bad}'
          print(f'{len(files)} AI workflows use immutable action SHAs')
          PY
