[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cliniga-ml-lab"
version = "0.1.0"
description = "Reproducible LoRA/QLoRA supervised fine-tuning laboratory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.13.0",
  "transformers==5.16.1",
  "trl==1.12.0",
  "peft==0.20.0",
  "datasets==5.0.1",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.2; platform_system != 'Darwin'",
  "safetensors>=0.6,<1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
