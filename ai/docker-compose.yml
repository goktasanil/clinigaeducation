services:
  qdrant:
    image: "${CLINIGA_QDRANT_IMAGE:?Set CLINIGA_QDRANT_IMAGE to an immutable image reference}"
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:6333:6333"
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: "${CLINIGA_REDIS_IMAGE:?Set CLINIGA_REDIS_IMAGE to an immutable image reference}"
    command: redis-server --appendonly yes
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: "${CLINIGA_POSTGRES_IMAGE:?Set CLINIGA_POSTGRES_IMAGE to an immutable pgvector-enabled image reference}"
    environment:
      POSTGRES_USER: cliniga
      POSTGRES_PASSWORD: "${CLINIGA_POSTGRES_PASSWORD:?Set CLINIGA_POSTGRES_PASSWORD}"
      POSTGRES_DB: cliniga
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: "${CLINIGA_MINIO_IMAGE:?Set CLINIGA_MINIO_IMAGE to an immutable image reference}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${CLINIGA_S3_ACCESS_KEY:?Set CLINIGA_S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${CLINIGA_S3_SECRET_KEY:?Set CLINIGA_S3_SECRET_KEY}"
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:9000:9000"
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data

  vllm:
    image: "${CLINIGA_VLLM_IMAGE:?Set CLINIGA_VLLM_IMAGE to an immutable image reference}"
    profiles: ["gpu"]
    runtime: nvidia
    ipc: host
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:8001:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command:
      - --model
      - "${CLINIGA_MODEL:?Set CLINIGA_MODEL}"
      - --revision
      - "${CLINIGA_MODEL_REVISION:?Pin CLINIGA_MODEL_REVISION to an immutable commit SHA}"
      - --served-model-name
      - ${CLINIGA_SERVED_MODEL:-cliniga-general}
      - --dtype
      - auto
      - --max-model-len
      - ${CLINIGA_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${CLINIGA_GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  worker:
    image: "${CLINIGA_APP_IMAGE:?Set CLINIGA_APP_IMAGE to an immutable prebuilt application image}"
    working_dir: /workspace
    command: ["rq", "worker", "cliniga-ai"]
    environment:
      CLINIGA_REDIS_URL: redis://redis:6379/0
      CLINIGA_POSTGRES_DSN: "postgresql://cliniga:${CLINIGA_POSTGRES_PASSWORD:?Set CLINIGA_POSTGRES_PASSWORD}@postgres:5432/cliniga"
      CLINIGA_S3_ENDPOINT: http://minio:9000
      CLINIGA_S3_ACCESS_KEY: "${CLINIGA_S3_ACCESS_KEY:?Set CLINIGA_S3_ACCESS_KEY}"
      CLINIGA_S3_SECRET_KEY: "${CLINIGA_S3_SECRET_KEY:?Set CLINIGA_S3_SECRET_KEY}"
      CLINIGA_QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - postgres
      - minio
      - qdrant

  api:
    image: "${CLINIGA_APP_IMAGE:?Set CLINIGA_APP_IMAGE to an immutable prebuilt application image}"
    working_dir: /workspace
    command: ["uvicorn", "ai.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${CLINIGA_BIND_HOST:-127.0.0.1}:8000:8000"
    environment:
      CLINIGA_QDRANT_URL: http://qdrant:6333
      CLINIGA_REDIS_URL: redis://redis:6379/0
      CLINIGA_POSTGRES_DSN: "postgresql://cliniga:${CLINIGA_POSTGRES_PASSWORD:?Set CLINIGA_POSTGRES_PASSWORD}@postgres:5432/cliniga"
      CLINIGA_S3_ENDPOINT: http://minio:9000
      CLINIGA_S3_ACCESS_KEY: "${CLINIGA_S3_ACCESS_KEY:?Set CLINIGA_S3_ACCESS_KEY}"
      CLINIGA_S3_SECRET_KEY: "${CLINIGA_S3_SECRET_KEY:?Set CLINIGA_S3_SECRET_KEY}"
      CLINIGA_LLM_BASE_URL: ${CLINIGA_LLM_BASE_URL:-http://vllm:8000/v1}
      CLINIGA_LLM_API_KEY: "${CLINIGA_LLM_API_KEY:?Set CLINIGA_LLM_API_KEY}"
      CLINIGA_GENERAL_MODEL: ${CLINIGA_SERVED_MODEL:-cliniga-general}
      CLINIGA_REASONING_MODEL: ${CLINIGA_REASONING_MODEL:-${CLINIGA_SERVED_MODEL:-cliniga-general}}
      CLINIGA_CODE_MODEL: ${CLINIGA_CODE_MODEL:-${CLINIGA_SERVED_MODEL:-cliniga-general}}
    depends_on:
      - qdrant
      - redis
      - postgres
      - minio

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  minio_data:
  hf_cache:
