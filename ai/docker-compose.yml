services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cliniga
      POSTGRES_PASSWORD: ${CLINIGA_POSTGRES_PASSWORD:-cliniga}
      POSTGRES_DB: cliniga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CLINIGA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CLINIGA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  meilisearch:
    image: getmeili/meilisearch:latest
    profiles: ["growth"]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${CLINIGA_MEILISEARCH_API_KEY:-change-me}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command:
      - --model
      - ${CLINIGA_MODEL:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${CLINIGA_SERVED_MODEL:-cliniga-general}
      - --dtype
      - auto
      - --max-model-len
      - ${CLINIGA_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${CLINIGA_GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  worker:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r ai/requirements.txt -r ai/requirements-domain.txt && rq worker cliniga-ai"
    volumes:
      - ..:/workspace
    environment:
      CLINIGA_REDIS_URL: redis://redis:6379/0
      CLINIGA_POSTGRES_DSN: postgresql://cliniga:${CLINIGA_POSTGRES_PASSWORD:-cliniga}@postgres:5432/cliniga
      CLINIGA_S3_ENDPOINT: http://minio:9000
      CLINIGA_S3_ACCESS_KEY: ${CLINIGA_S3_ACCESS_KEY:-minioadmin}
      CLINIGA_S3_SECRET_KEY: ${CLINIGA_S3_SECRET_KEY:-minioadmin}
      CLINIGA_QDRANT_URL: http://qdrant:6333
      CLINIGA_MEILISEARCH_URL: ${CLINIGA_MEILISEARCH_URL:-http://meilisearch:7700}
      CLINIGA_MEILISEARCH_API_KEY: ${CLINIGA_MEILISEARCH_API_KEY:-}
    depends_on:
      - redis
      - postgres
      - minio
      - qdrant

  api:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r ai/requirements.txt -r ai/requirements-domain.txt && uvicorn ai.app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
    environment:
      CLINIGA_QDRANT_URL: http://qdrant:6333
      CLINIGA_REDIS_URL: redis://redis:6379/0
      CLINIGA_POSTGRES_DSN: postgresql://cliniga:${CLINIGA_POSTGRES_PASSWORD:-cliniga}@postgres:5432/cliniga
      CLINIGA_S3_ENDPOINT: http://minio:9000
      CLINIGA_S3_ACCESS_KEY: ${CLINIGA_S3_ACCESS_KEY:-minioadmin}
      CLINIGA_S3_SECRET_KEY: ${CLINIGA_S3_SECRET_KEY:-minioadmin}
      CLINIGA_LLM_BASE_URL: ${CLINIGA_LLM_BASE_URL:-http://vllm:8000/v1}
      CLINIGA_LLM_API_KEY: ${CLINIGA_LLM_API_KEY:-local}
      CLINIGA_GENERAL_MODEL: ${CLINIGA_SERVED_MODEL:-cliniga-general}
      CLINIGA_REASONING_MODEL: ${CLINIGA_REASONING_MODEL:-${CLINIGA_SERVED_MODEL:-cliniga-general}}
      CLINIGA_CODE_MODEL: ${CLINIGA_CODE_MODEL:-${CLINIGA_SERVED_MODEL:-cliniga-general}}
      CLINIGA_MEILISEARCH_URL: ${CLINIGA_MEILISEARCH_URL:-http://meilisearch:7700}
      CLINIGA_MEILISEARCH_API_KEY: ${CLINIGA_MEILISEARCH_API_KEY:-}
      CLINIGA_POSTHOG_API_KEY: ${CLINIGA_POSTHOG_API_KEY:-}
      CLINIGA_POSTHOG_HOST: ${CLINIGA_POSTHOG_HOST:-https://us.i.posthog.com}
      CLINIGA_ZOTERO_LIBRARY_ID: ${CLINIGA_ZOTERO_LIBRARY_ID:-}
      CLINIGA_ZOTERO_LIBRARY_TYPE: ${CLINIGA_ZOTERO_LIBRARY_TYPE:-user}
      CLINIGA_ZOTERO_API_KEY: ${CLINIGA_ZOTERO_API_KEY:-}
      CLINIGA_SERPAPI_API_KEY: ${CLINIGA_SERPAPI_API_KEY:-}
      CLINIGA_MATOMO_URL: ${CLINIGA_MATOMO_URL:-}
      CLINIGA_MATOMO_TOKEN: ${CLINIGA_MATOMO_TOKEN:-}
      CLINIGA_PLAUSIBLE_URL: ${CLINIGA_PLAUSIBLE_URL:-}
      CLINIGA_PLAUSIBLE_API_KEY: ${CLINIGA_PLAUSIBLE_API_KEY:-}
      CLINIGA_TWENTY_URL: ${CLINIGA_TWENTY_URL:-}
      CLINIGA_TWENTY_API_KEY: ${CLINIGA_TWENTY_API_KEY:-}
      CLINIGA_CALCOM_URL: ${CLINIGA_CALCOM_URL:-}
      CLINIGA_CALCOM_API_KEY: ${CLINIGA_CALCOM_API_KEY:-}
      CLINIGA_EVIDENCE_URL: ${CLINIGA_EVIDENCE_URL:-}
      CLINIGA_EVIDENCE_API_KEY: ${CLINIGA_EVIDENCE_API_KEY:-}
      CLINIGA_TRENDYOL_API_URL: ${CLINIGA_TRENDYOL_API_URL:-}
      CLINIGA_TRENDYOL_API_TOKEN: ${CLINIGA_TRENDYOL_API_TOKEN:-}
    depends_on:
      - qdrant
      - redis
      - postgres
      - minio

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  minio_data:
  meilisearch_data:
  hf_cache:
