services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r ai/requirements.txt && uvicorn ai.app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
    environment:
      CLINIGA_QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_data:
