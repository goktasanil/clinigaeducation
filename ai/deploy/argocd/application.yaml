apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliniga-ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/goktasanil/clinigaeducation.git
    targetRevision: cliniga-ai-engine
    path: ai/deploy/helm
  destination:
    server: https://kubernetes.default.svc
    namespace: cliniga-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
