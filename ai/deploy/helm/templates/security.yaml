apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliniga-ai-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliniga-ai-api-allow
spec:
  podSelector:
    matchLabels:
      app: cliniga-ai
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 9000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliniga-ai-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cliniga-ai
