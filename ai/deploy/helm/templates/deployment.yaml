apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: CLINIGA_QDRANT_URL
              value: {{ .Values.config.qdrantUrl | quote }}
            - name: CLINIGA_REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: CLINIGA_POSTGRES_DSN
              value: {{ .Values.config.postgresDsn | quote }}
            - name: CLINIGA_S3_ENDPOINT
              value: {{ .Values.config.s3Endpoint | quote }}
            - name: CLINIGA_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: llm-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
